name: Orbit Deploy Setup
description: Common setup steps for Orbit canister deployments (toolchain, dfx, identity, dfx-orbit)

inputs:
  sha:
    description: "Commit SHA to checkout (leave empty to use github.sha)"
    required: false
    default: ""
  deployer_secret:
    description: "Deployer PEM private key (secrets.DEPLOYER)"
    required: true
  orbit_station_id:
    description: "Orbit station ID (vars.ORBIT_STATION_ID)"
    required: true

outputs:
  operator:
    description: "Deployer principal returned by dfx identity get-principal"
    value: ${{ steps.identity.outputs.operator }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.sha || github.sha }}

    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-rust

    - name: Setup IC tooling
      uses: ./.github/actions/setup-ic-tools

    - name: Install didc
      shell: bash
      run: |
        wget https://github.com/dfinity/candid/releases/download/2025-10-16/didc-linux64 -O /usr/local/bin/didc
        chmod +x /usr/local/bin/didc

    - name: Install Just command runner
      uses: extractions/setup-just@v4

    - name: Create Deployer private key file
      shell: bash
      run: echo "${{ inputs.deployer_secret }}" > private_key.pem

    # DANGEROUS: This is a plaintext identity import
    - name: Import Deployer identity
      id: identity
      shell: bash
      run: |
        dfx identity import deployer private_key.pem --storage-mode=plaintext
        dfx identity use deployer
        echo "Deployer principal: $(dfx identity get-principal)"
        echo "operator=$(dfx identity get-principal)" >> $GITHUB_OUTPUT

    # DANGEROUS: Do not echo the private key to the console
    - name: Clean up private key file
      shell: bash
      run: rm private_key.pem

    - name: Cache dfx-orbit binary
      id: cache-dfx-orbit
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/dfx-orbit
        key: dfx-orbit-cli

    - name: Install dfx-orbit
      if: steps.cache-dfx-orbit.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone https://github.com/CashierHQ/orbit.git
        cd orbit
        cargo install -f --path tools/dfx-orbit/

    - name: Setup Orbit station
      shell: bash
      run: dfx-orbit station add cashier --station-id ${{ inputs.orbit_station_id }} --network ic

    - name: Verify Orbit station
      shell: bash
      run: dfx-orbit station list
