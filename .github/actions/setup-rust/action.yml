name: "Setup Rust toolchain"
description: "Installs the pinned Rust toolchain with clippy, rustfmt, and optional targets."

inputs:
  toolchain:
    description: "Rust toolchain version"
    required: false
    default: "1.93.1"
  targets:
    description: "Comma-separated rustup targets"
    required: false
    default: "wasm32-unknown-unknown"
  components:
    description: "Comma-separated rustup components"
    required: false
    default: "clippy,rustfmt"

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Configure RUST_BACKTRACE
      shell: bash
      run: echo "RUST_BACKTRACE=full" >> "$GITHUB_ENV"
