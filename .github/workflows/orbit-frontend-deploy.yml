name: Orbit Frontend Deploy

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "src/cashier_frontend_new/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment mode"
        required: true
        default: "upgrade"
        type: choice
        options:
          - reinstall
          - upgrade
          - install
      sha:
        description: "Exact commit SHA to deploy (passed by fast-forward trigger to avoid stale checkout race condition)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  setup_environment:
    runs-on: ubuntu-latest
    outputs:
      network: ${{ steps.set-env.outputs.network }}
      mode: ${{ steps.set-mode.outputs.mode }}
    steps:
      - name: Set deployment network
        id: set-env
        run: |
          # For pull requests, use base_ref, for pushes use ref_name
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          echo "Detected branch: $TARGET_BRANCH"

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            echo "network=production" >> $GITHUB_OUTPUT
          elif [[ "$TARGET_BRANCH" == "staging" ]]; then
            echo "network=staging" >> $GITHUB_OUTPUT
          else
            # Any other branch will deploy to dev network
            echo "network=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set deployment mode
        id: set-mode
        run: |
          # Use input mode if provided (workflow_dispatch), otherwise default to 'upgrade'
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [[ -n "$INPUT_MODE" ]]; then
            echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
          else
            echo "mode=upgrade" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Prepare and Submit Orbit request (optional)
    needs: setup_environment
    environment: ${{ needs.setup_environment.outputs.network }}
    env:
      MODE: ${{ needs.setup_environment.outputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - name: Orbit deploy setup
        id: identity
        uses: ./.github/actions/orbit-deploy-setup
        with:
          sha: ${{ inputs.sha }}
          deployer_secret: ${{ secrets.DEPLOYER }}
          orbit_station_id: ${{ vars.ORBIT_STATION_ID }}

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build canisters
        run: just build ${{ needs.setup_environment.outputs.network }}

      - name: Deploy frontend
        id: frontend
        env:
          DFX_WARNING: -mainnet_plaintext_identity
        shell: bash
        run: |
          set -o pipefail
          set -x
          canister_id=$(just get_canister_id cashier_frontend_new ${{ needs.setup_environment.outputs.network }})
          # Capture JSON output (last line from upload_asset)
          output=$(just upload_asset ${canister_id} 2>&1 | tail -1)
          rc=${PIPESTATUS[0]}

          # Parse JSON fields
          echo "batch_id=$(echo "$output" | jq -r '.batch_id')" >> $GITHUB_OUTPUT
          echo "evidence=$(echo "$output" | jq -r '.evidence')" >> $GITHUB_OUTPUT
          echo "request_url=$(echo "$output" | jq -r '.request_url')" >> $GITHUB_OUTPUT
          echo "canister_id=$canister_id" >> $GITHUB_OUTPUT

          if [ "$rc" -ne 0 ]; then
            echo "::error ::upload_asset failed with exit code $rc"
            exit $rc
          fi

      - name: Write Job Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🚀 Orbit Frontend Deploy Summary

          - **Network**: `${{ needs.setup_environment.outputs.network }}`
          - **Mode**: `${{ env.MODE }}`
          - **Canister id**: `${{ steps.frontend.outputs.canister_id }}`
          - **Operator Principal**: `${{ steps.identity.outputs.operator }}`

          ### Frontend Canister
          | Field | Value |
          |-------|-------|
          | Batch ID | `${{ steps.frontend.outputs.batch_id }}` |
          | Evidence | `${{ steps.frontend.outputs.evidence }}` |
          | Request URL | ${{ steps.frontend.outputs.request_url }} |

          ---
          EOF
          echo "*Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> "$GITHUB_STEP_SUMMARY"
