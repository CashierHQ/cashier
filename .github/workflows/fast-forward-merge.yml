name: Fast Forward Merge

on:
  issue_comment:
    types: [created]

jobs:
  fast-forward:
    # Step 1: Only run on PR comments starting with /fast-forward
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/fast-forward')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: write

    steps:
      # Step 1: Checkout repo so scripts are available for all steps
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Check all CI checks passed
      - name: Check all CI checks passed
        uses: actions/github-script@v7
        with:
          script: |
            const { checkCiStatus } = require('./.github/scripts/check-ci-status.js');
            await checkCiStatus({ github, context, core });

      # Step 3: Check if commenter has maintain/admin permission
      - name: Check commenter permission (maintain or admin)
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;

            // Get commenter's permission level
            const { data: permissionData } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter
            });

            const permission = permissionData.permission;
            console.log(`User ${commenter} has permission: ${permission}`);

            // Only allow maintain or admin permissions
            const allowedPermissions = ['maintain', 'admin'];
            if (!allowedPermissions.includes(permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${commenter} You don't have permission to run \`/fast-forward\`. Required: maintain or admin access.`
              });
              core.setFailed(`User ${commenter} lacks permission (has: ${permission}, required: maintain or admin)`);
              return;
            }

            console.log(`Permission check passed for ${commenter}`);

      # Step 4: Check all assigned reviewers approved
      - name: Check all assigned reviewers approved
        uses: actions/github-script@v7
        with:
          script: |
            const { checkReviewerApproval } = require('./.github/scripts/check-reviewer-approval.js');
            await checkReviewerApproval({ github, context, core });

      # Step 5: Execute fast-forward merge
      # Step 6: PR auto-closed on success
      - name: Fast Forward Merge
        uses: sequoia-pgp/fast-forward@v1
        with:
          merge: true
          comment: always

      # Step 7: Trigger deploy workflows based on changed files
      - name: Trigger deploy workflows
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { triggerDeploys } = require('./.github/scripts/trigger-deploys.js');
            await triggerDeploys({ github, context, core });
