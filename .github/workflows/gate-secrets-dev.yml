name: Set Gate Secrets (dev)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Secret storage mode'
        required: true
        default: 'plaintext'
        type: choice
        options:
          - plaintext
          - vetkd

permissions:
  contents: read

jobs:
  set_gate_secrets:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup IC tooling
        uses: ./.github/actions/setup-ic-tools

      - name: Create Deployer private key file
        run: echo "${{ secrets.DEPLOYER }}" > private_key.pem

      # DANGEROUS: This is a plaintext identity import
      - name: Import Deployer identity
        run: |
          dfx identity import deployer private_key.pem --storage-mode=plaintext
          dfx identity use deployer
      # DANGEROUS: Do not echo the private key to the console

      - name: Clean up private key file
        run: rm private_key.pem

      - name: Install vetkd deps
        if: ${{ inputs.mode == 'vetkd' }}
        working-directory: src/cashier_frontend_new
        run: pnpm install --frozen-lockfile

      - name: Write scripts/.env from Environment secrets
        env:
          TWITTER_API_KEY: ${{ secrets.GATE_TWITTER_API_KEY }}
          X_OAUTH_BASIC_AUTH: ${{ secrets.GATE_X_OAUTH_BASIC_AUTH }}
          X_REDIRECT_URI: ${{ secrets.GATE_X_REDIRECT_URI }}
          X_BEARER_TOKEN: ${{ secrets.GATE_X_BEARER_TOKEN }}
          BREVO_API_KEY: ${{ secrets.GATE_BREVO_API_KEY }}
          BREVO_EMAIL_SENDER: ${{ secrets.GATE_BREVO_EMAIL_SENDER }}
        run: |
          cat > scripts/.env <<EOF
          TWITTER_API_KEY=${TWITTER_API_KEY}
          X_OAUTH_BASIC_AUTH=${X_OAUTH_BASIC_AUTH}
          X_REDIRECT_URI=${X_REDIRECT_URI}
          X_BEARER_TOKEN=${X_BEARER_TOKEN}
          BREVO_API_KEY=${BREVO_API_KEY}
          BREVO_EMAIL_SENDER=${BREVO_EMAIL_SENDER}
          EOF

      - name: Upload gate secrets
        env:
          DFX_WARNING: -mainnet_plaintext_identity
        run: node scripts/set-gate-secrets.mjs --mode ${{ inputs.mode }} --network dev

      - name: Clean up scripts/.env
        if: always()
        run: rm -f scripts/.env
