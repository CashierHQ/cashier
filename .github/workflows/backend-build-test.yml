name: "Build test backend"

on:
  pull_request:
    branches: [main, dev, staging]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/cashier_backend/**"
      - "src/cashier_backend_client/**"
      - "src/cashier_backend_types/**"
      - "src/gate_service/**"
      - "src/gate_service_client/**"
      - "src/gate_service_types/**"
      - "src/token_storage/**"
      - "src/token_storage_client/**"
      - "src/token_storage_types/**"
      - "src/transaction_manager/**"
      - "src/integration_tests/**"
      - "src/lib/**"
      - "src/cashier_frontend_new/src/lib/generated/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: "Rust Code Check"
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ""

      - name: Install Just command runner
        uses: extractions/setup-just@v4

      - name: Configure Rust Cache
        uses: swatinem/rust-cache@v2
        if: ${{ (github.event.pull_request.base.ref != 'main') && (github.ref_name != 'main') }}
        with:
          shared-key: ${{ github.repository }}
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Rust - Check code style
        run: |
          just check_code

  backend-build:
    name: "Backend Build"
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Just command runner
        uses: extractions/setup-just@v4

      - name: Setup IC tooling
        uses: ./.github/actions/setup-ic-tools

      - name: Configure Rust Cache
        uses: swatinem/rust-cache@v2
        if: ${{ (github.event.pull_request.base.ref != 'main') && (github.ref_name != 'main') }}
        with:
          shared-key: ${{ github.repository }}
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Build
        # Set a mock Amplitude API key to prevent build failures due to missing environment variable
        env:
          PUBLIC_AMPLITUDE_API_KEY: "mock-amplitude-key"
        run: |
          just build

      - name: Unit Test
        run: |
          just test_unit

      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/bin

      - name: Create nextest archive
        run: |
          cargo nextest archive -p integration_tests --archive-file target/nextest-archive.tar.zst

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            target/artifacts/
            target/nextest-archive.tar.zst
          retention-days: 1

  integration-test:
    name: "Integration Test (shard ${{ matrix.partition }}/${{ matrix.total }})"
    needs: backend-build
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v4

      - name: Install Just command runner
        uses: extractions/setup-just@v4

      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/bin

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: target

      - name: Run integration tests (shard ${{ matrix.partition }}/${{ matrix.total }})
        run: |
          just test_integration ${{ matrix.partition }} ${{ matrix.total }} target/nextest-archive.tar.zst ${{ github.workspace }}

  cleanup-artifacts:
    name: "Cleanup Artifacts"
    needs: integration-test
    if: always()
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: test-artifacts

  backend-test-i686:
    name: "Backend Test (i686)"
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: i686-unknown-linux-gnu

      - name: Install Just command runner
        uses: extractions/setup-just@v4

      - name: Configure Rust Cache
        uses: swatinem/rust-cache@v2
        if: ${{ (github.event.pull_request.base.ref != 'main') && (github.ref_name != 'main') }}
        with:
          shared-key: ${{ github.repository }}
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Install multilib
        run: |
          sudo apt update
          sudo apt install gcc-multilib

      - name: Test - 32 bits
        run: |
          just test_unit_i686
