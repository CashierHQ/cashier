name: Set Gate Password Hashing Mode (dev)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Password hashing mode'
        required: true
        default: 'sha256'
        type: choice
        options:
          - sha256
          - argon2id

permissions:
  contents: read

jobs:
  set_password_hashing_mode:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup IC tooling
        uses: ./.github/actions/setup-ic-tools

      - name: Create Deployer private key file
        run: echo "${{ secrets.DEPLOYER }}" > private_key.pem

      # DANGEROUS: This is a plaintext identity import
      - name: Import Deployer identity
        run: |
          dfx identity import deployer private_key.pem --storage-mode=plaintext
          dfx identity use deployer
      # DANGEROUS: Do not echo the private key to the console

      - name: Clean up private key file
        run: rm private_key.pem

      - name: Set password hashing mode
        env:
          DFX_WARNING: -mainnet_plaintext_identity
        run: node scripts/set-password-hashing-mode.mjs --mode ${{ inputs.mode }} --network dev
